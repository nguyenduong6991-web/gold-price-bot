name: Gold Price Bot
on:
  schedule:
    - cron: '0 */2 * * *'  # === MỖI 2 GIỜ 1 LẦN ===
  workflow_dispatch:  # Cho chạy thủ công luôn

jobs:
  send-gold-price:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install requests
        run: pip install requests
      
      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot_vang.py

name: Gold Price Bot
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  send-gold-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install requests
        run: pip install requests
      
      - name: Run bot
        run: python bot_vang.py
      
      - name: Lưu lịch sử giá
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"
          git add -A
          git commit -m "Cập nhật giá $(date +'%d/%m %H:%M')" || echo "Không có thay đổi"
          git push
